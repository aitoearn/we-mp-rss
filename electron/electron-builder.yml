appId: com.aitoearn.werss
productName: WeRSS
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - afterPack.js
  - package.json

afterPack: ./afterPack.js

extraResources:
  - from: ../resources/backend/werss-gui
    to: backend/werss-gui
  - from: ../config.example.yaml
    to: config.example.yaml

mac:
  target:
    - dmg
  category: public.app-category.productivity
  identity: null

dmg:
  writeUpdateInfo: false
  format: UDZO
  sign: false

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
  category: Network
  maintainer: aitoearn
